name: Regenerate Nuvio Discover Artwork

on:
  workflow_dispatch:
  schedule:
    # Monthly on the 1st at 09:00 UTC
    - cron: "0 9 1 * *"

permissions:
  contents: write

concurrency:
  group: nuvio-discover-artwork
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out artwork repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests Pillow

      - name: Generate category covers and hero backdrops
        env:
          AIO_METADATA_MANIFEST_URL_1: ${{ secrets.AIO_METADATA_MANIFEST_URL_1 }}
          AIO_METADATA_MANIFEST_URL_2: ${{ secrets.AIO_METADATA_MANIFEST_URL_2 }}
          BINGECAT_MANIFEST_URL: ${{ secrets.BINGECAT_MANIFEST_URL }}
        run: python scripts/generate_discover_backdrops.py

      - name: Commit and push refreshed artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Publishing artwork (attempt $attempt of 3)..."

            git fetch origin main
            git reset --mixed origin/main

            git add "Discover/Trending/Cover/cover.webp" \
                    "Discover/Popular/Cover/cover.webp" \
                    "Discover/Latest Releases/Cover/cover.webp" \
                    "Discover/Top Rated/Cover/cover.webp" \
                    "Discover/For You/Cover/cover.webp" \
                    "Discover/Trending/Backdrop/backdrop.webp" \
                    "Discover/Popular/Backdrop/backdrop.webp" \
                    "Discover/Latest Releases/Backdrop/backdrop.webp" \
                    "Discover/Top Rated/Backdrop/backdrop.webp" \
                    "Discover/For You/Backdrop/backdrop.webp" \
                    "Discover/Trending/Logo/logo.webp" \
                    "Discover/Popular/Logo/logo.webp" \
                    "Discover/Latest Releases/Logo/logo.webp" \
                    "Discover/Top Rated/Logo/logo.webp" \
                    "Discover/For You/Logo/logo.webp" \
                    "Discover/artwork-audit.json"

            if git diff --cached --quiet; then
              echo "No artwork changes to publish."
              exit 0
            fi

            git commit -m "Refresh automated Discover covers and hero backdrops"

            if git push origin HEAD:main; then
              echo "Artwork successfully published."
              exit 0
            fi

            echo "Push rejected. Will synchronize and retry."
          done

          echo "ERROR: Could not publish artwork after 3 attempts."
          exit 1
