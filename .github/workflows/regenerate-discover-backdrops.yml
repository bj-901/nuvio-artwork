name: Regenerate Nuvio Discover Backdrops

on:
  workflow_dispatch:
  schedule:
    # Monthly on the 1st at 09:00 UTC
    - cron: "0 9 1 * *"

permissions:
  contents: write

concurrency:
  group: nuvio-discover-backdrops
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out artwork repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests Pillow

      - name: Generate category backdrops
        env:
          AIO_METADATA_MANIFEST_URL_1: ${{ secrets.AIO_METADATA_MANIFEST_URL_1 }}
          AIO_METADATA_MANIFEST_URL_2: ${{ secrets.AIO_METADATA_MANIFEST_URL_2 }}
          BINGECAT_MANIFEST_URL: ${{ secrets.BINGECAT_MANIFEST_URL }}
        run: python scripts/generate_discover_backdrops.py

      - name: Commit and push updated backdrops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Discover/Trending/Backdrop/backdrop.webp" \
                  "Discover/Popular/Backdrop/backdrop.webp" \
                  "Discover/Latest Releases/Backdrop/backdrop.webp" \
                  "Discover/Top Rated/Backdrop/backdrop.webp" \
                  "Discover/For You/Backdrop/backdrop.webp"
          if git diff --cached --quiet; then
            echo "No backdrop changes to publish."
          else
            git commit -m "Refresh automated Discover hero backdrops"
            git push
          fi
